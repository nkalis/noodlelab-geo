# Checks the plugin on every push; on a version tag (v1.2.0) also builds the
# wheel, signs it with a GitHub build attestation (Sigstore) and attaches it
# to a GitHub release. Plugin indexes list that signed wheel.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e . pytest
      - run: uv run noodlelab check-plugin .
      - run: uv run noodlelab plugins test geo
      - run: uv run pytest -q

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v5
      - run: uv build --wheel
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.whl
      - run: gh release create "$GITHUB_REF_NAME" dist/*.whl --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
